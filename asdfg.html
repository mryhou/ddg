<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTBK Master: English Companion (Kelas XI)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center">
            <div class="flex items-center space-x-3 mb-2 sm:mb-0">
                <span class="bg-indigo-700 p-2 rounded-xl text-xl">🎓</span>
                <div>
                    <h1 class="text-xl font-bold">UTBK Master: English</h1>
                    <p class="text-xs text-indigo-200">Media Pembelajaran Interaktif Kelas XI</p>
                </div>
            </div>
            <nav class="flex flex-wrap gap-1 text-sm justify-center" id="nav-buttons">
                <!-- Navigation buttons populated via JS -->
            </nav>
        </div>
    </header>

    <main class="max-w-4xl w-full mx-auto p-4 sm:p-6 my-6 flex-grow">
        <div id="app-container" class="bg-white rounded-2xl shadow-xl p-6 sm:p-8 border border-slate-100 transition-all">
            <!-- Dynamic Content Injected Here -->
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        <p>© 2026 UTBK Preparation Companion. Designed for Grade 11 Students.</p>
    </footer>

    <script>
        // State Management
        let currentScreen = 'home'; // home, objectives, pretest, materials, game, posttest, review, reflection, finish
        let pretestAnswers = {};
        let posttestAnswers = {};
        let score = 0;
        let gameScore = 0;
        let reflectionData = { rating: 5, note: '' };

        // Data Pretest
        const pretestData = [
            {
                id: 1,
                question: "What is usually the main idea of the first paragraph in a standard reading passage?",
                options: ["A supporting detail", "The topic sentence / main argument", "The author's personal confession", "A random conclusion"],
                answer: 1
            },
            {
                id: 2,
                question: "If it rains tomorrow, we ____ at home. (Complete the conditional sentence)",
                options: ["stayed", "would stay", "will stay", "had stayed"],
                answer: 2
            },
            {
                id: 3,
                question: "What does an 'objective' tone mean in reading texts?",
                options: ["Emotional and angry", "Factual and neutral without personal bias", "Persuading readers to buy something", "Humorous and sarcastic"],
                answer: 1
            }
        ];

        // Data Posttest
        const posttestData = [
            {
                id: 1,
                question: "Text snippet: 'Artificial Intelligence is revolutionizing medicine by detecting diseases faster than humans.' What is the author's primary purpose?",
                options: [
                    "To warn people about the danger of machines",
                    "To inform readers about AI's positive impact in medicine",
                    "To persuade doctors to quit their jobs",
                    "To entertain readers with futuristic stories"
                ],
                answer: 1,
                explanation: "The passage states facts about AI improving medical speed, which serves to inform the reader objectively about its benefits."
            },
            {
                id: 2,
                question: "Choose the correct passive form: 'The committee is discussing the proposal right now.'",
                options: [
                    "The proposal is discussed by the committee.",
                    "The proposal was being discussed by the committee.",
                    "The proposal is being discussed by the committee right now.",
                    "The proposal has been discussed by the committee."
                ],
                answer: 2,
                explanation: "Active tense is Present Continuous ('is discussing'). Therefore, the passive must be Present Continuous Passive ('is being discussed')."
            },
            {
                id: 3,
                question: "If she had studied harder, she _____ the university entrance exam last year.",
                options: [
                    "passed",
                    "would pass",
                    "would have passed",
                    "will pass"
                ],
                answer: 2,
                explanation: "This is Conditional Type 3 ('If + past perfect'). The main clause must use 'would have + V3'."
            },
            {
                id: 4,
                question: "Which keyword usually signals a contrast in a reading passage?",
                options: ["Furthermore", "Consequently", "However", "In addition"],
                answer: 2,
                explanation: "'However' is a classic transitional word used to show contrast or opposition between ideas."
            },
            {
                id: 5,
                question: "What does 'Author's Tone' refer to?",
                options: [
                    "The volume of the speaker's voice",
                    "The author's attitude or emotional state toward the subject",
                    "The physical location where the book was written",
                    "The font style used in the publication"
                ],
                answer: 1,
                explanation: "Tone expresses the attitude or feelings of the writer toward the topic discussed in the text."
            }
        ];

        // Navigation list setup
        const screens = [
            { id: 'home', label: '🏠 Beranda' },
            { id: 'objectives', label: '🎯 Tujuan' },
            { id: 'pretest', label: '📝 Pre-Test' },
            { id: 'materials', label: '📚 Materi' },
            { id: 'game', label: '🎮 Simulasi Game' },
            { id: 'posttest', label: '📊 Post-Test' },
            { id: 'reflection', label: '💬 Refleksi' }
        ];

        function renderNav() {
            const navContainer = document.getElementById('nav-buttons');
            navContainer.innerHTML = screens.map(s => `
                <button onclick="switchScreen('${s.id}')" 
                    class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-colors ${currentScreen === s.id ? 'bg-indigo-800 text-white shadow-inner' : 'bg-indigo-500 hover:bg-indigo-400 text-indigo-50'}">
                    ${s.label}
                </button>
            `).join('');
        }

        function switchScreen(screenId) {
            currentScreen = screenId;
            renderNav();
            renderContent();
        }

        function renderContent() {
            const container = document.getElementById('app-container');
            
            switch(currentScreen) {
                case 'home':
                    container.innerHTML = `
                        <div class="text-center py-6">
                            <span class="text-5xl mb-4 inline-block">🚀</span>
                            <h2 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-3">Kuasai UTBK Bahasa Inggris</h2>
                            <p class="text-slate-600 max-w-xl mx-auto mb-6 text-sm sm:text-base">
                                Dirancang khusus untuk siswa Kelas XI. Pelajari pola soal, pahami strategi cepat membaca, uji kemampuanmu dengan game simulasi, dan raih skor impianmu di SNBT!
                            </p>
                            <div class="flex flex-wrap justify-center gap-3">
                                <button onclick="switchScreen('objectives')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl shadow transition-transform active:scale-95 text-sm">
                                    Mulai Belajar Sekarang ➔
                                </button>
                                <button onclick="switchScreen('pretest')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-6 py-3 rounded-xl transition text-sm">
                                    Ikuti Pre-Test
                                </button>
                            </div>
                        </div>
                    `;
                    break;

                case 'objectives':
                    container.innerHTML = `
                        <div>
                            <h2 class="text-xl font-bold text-slate-900 mb-4 flex items-center gap-2"><span>🎯</span> Tujuan Pembelajaran</h2>
                            <p class="text-slate-600 mb-4 text-sm">Setelah menyelesaikan media interaktif ini, kamu diharapkan mampu:</p>
                            <ul class="space-y-3 mb-6">
                                <li class="flex items-start gap-3 bg-indigo-50/50 p-3 rounded-xl border border-indigo-100 text-sm">
                                    <span class="bg-indigo-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shrink-0 font-bold">1</span>
                                    <span>Menganalisis <strong>Main Idea</strong> dan informasi rinci tersurat/tersirat (*Scanning & Skimming*) pada teks UTBK.</span>
                                </li>
                                <li class="flex items-start gap-3 bg-indigo-50/50 p-3 rounded-xl border border-indigo-100 text-sm">
                                    <span class="bg-indigo-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shrink-0 font-bold">2</span>
                                    <span>Menentukan <strong>Author's Purpose, Tone, and Attitude</strong> secara akurat dalam berbagai jenis teks ilmiah/populer.</span>
                                </li>
                                <li class="flex items-start gap-3 bg-indigo-50/50 p-3 rounded-xl border border-indigo-100 text-sm">
                                    <span class="bg-indigo-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shrink-0 font-bold">3</span>
                                    <span>Menguasai pola tata bahasa esensial UTBK seperti <strong>Conditional Sentences</strong> dan <strong>Passive Voice</strong>.</span>
                                </li>
                            </ul>
                            <div class="flex justify-end">
                                <button onclick="switchScreen('pretest')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl font-medium text-sm transition">
                                    Lanjut ke Pre-Test ➔
                                </button>
                            </div>
                        </div>
                    `;
                    break;

                case 'pretest':
                    container.innerHTML = `
                        <div>
                            <div class="border-b pb-3 mb-4 flex justify-between items-center">
                                <h2 class="text-xl font-bold text-slate-900">📝 Pre-Test Kemampuan Awal</h2>
                                <span class="text-xs bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full font-medium">Uji Cepat</span>
                            </div>
                            <p class="text-slate-600 text-sm mb-6">Jawab 3 pertanyaan singkat ini untuk mengukur kemampuan dasarmu sebelum masuk ke materi inti.</p>
                            
                            <div class="space-y-6">
                                ${pretestData.map((item, idx) => `
                                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                        <p class="font-medium text-sm text-slate-900 mb-3">${idx + 1}. ${item.question}</p>
                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                            ${item.options.map((opt, oIdx) => `
                                                <label class="flex items-center space-x-3 p-2.5 bg-white rounded-lg border border-slate-200 cursor-pointer hover:border-indigo-400 text-sm transition">
                                                    <input type="radio" name="pre_${item.id}" value="${oIdx}" ${pretestAnswers[item.id] == oIdx ? 'checked' : ''} onchange="pretestAnswers[${item.id}] = ${oIdx}" class="text-indigo-600">
                                                    <span>${opt}</span>
                                                </label>
                                            `).join('')}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>

                            <div class="mt-6 flex justify-between items-center">
                                <button onclick="switchScreen('objectives')" class="text-slate-600 hover:text-slate-900 text-sm font-medium">← Kembali</button>
                                <button onclick="submitPretest()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl font-medium text-sm shadow">
                                    Selesai Pre-Test & Masuk Materi ➔
                                </button>
                            </div>
                        </div>
                    `;
                    break;

                case 'materials':
                    container.innerHTML = `
                        <div>
                            <h2 class="text-xl font-bold text-slate-900 mb-2">📚 Materi Utama UTBK Bahasa Inggris</h2>
                            <p class="text-slate-600 text-sm mb-6">Pelajari rangkuman konsep penting yang paling sering keluar dalam ujian SNBT.</p>
                            
                            <div class="space-y-6">
                                <div class="bg-indigo-50/60 p-5 rounded-2xl border border-indigo-100">
                                    <h3 class="font-bold text-indigo-900 text-base mb-2">1. Reading: Finding Main Idea & Topic</h3>
                                    <p class="text-slate-700 text-sm mb-3">
                                        Ide utama biasanya terletak di awal kalimat paragraf pertama (deduktif) atau di kalimat terakhir (induktif). Gunakan metode <em>Scanning & Skimming</em> untuk mencari kata kunci (*keywords*) berulang tanpa membaca kata demi kata.
                                    </p>
                                    <div class="bg-white p-3 rounded-xl border border-indigo-100 text-xs text-slate-600">
                                        💡 <strong>Tips UTBK:</strong> Jika pertanyaan menanyakan "The best title...", pilih opsi yang merangkum keseluruhan isi teks, bukan hanya merangkum salah satu paragraf saja.
                                    </div>
                                </div>

                                <div class="bg-emerald-50/60 p-5 rounded-2xl border border-emerald-100">
                                    <h3 class="font-bold text-emerald-900 text-base mb-2">2. Author's Tone, Purpose, & Attitude</h3>
                                    <p class="text-slate-700 text-sm mb-3">
                                        Kenali emosi dan alasan penulis menyusun teks:
                                    </p>
                                    <ul class="list-disc pl-5 text-sm text-slate-700 space-y-1">
                                        <li><strong>Objective/Informative:</strong> Netral, menyajikan fakta data tanpa opini pribadi.</li>
                                        <li><strong>Persuasive:</strong> Mengajak atau meyakinkan pembaca melakukan sesuatu.</li>
                                        <li><strong>Critical:</strong> Menyoroti kelemahan, keraguan, atau mengevaluasi masalah.</li>
                                    </ul>
                                </div>

                                <div class="bg-amber-50/60 p-5 rounded-2xl border border-amber-100">
                                    <h3 class="font-bold text-amber-900 text-base mb-2">3. Grammar: Conditional Sentences & Passive Voice</h3>
                                    <p class="text-slate-700 text-sm mb-3">
                                        Rumus kilat tata bahasa ujian:
                                    </p>
                                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                                        <div class="bg-white p-3 rounded-lg border border-amber-200">
                                            <strong>Type 1:</strong><br>If + Present, Future<br><em>(If it rains, I will stay)</em>
                                        </div>
                                        <div class="bg-white p-3 rounded-lg border border-amber-200">
                                            <strong>Type 2:</strong><br>If + Past, Past Future<br><em>(If I had money, I would buy)</em>
                                        </div>
                                        <div class="bg-white p-3 rounded-lg border border-amber-200">
                                            <strong>Type 3:</strong><br>If + Past Perfect, Would have<br><em>(If she had studied, she'd have passed)</em>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-6 flex justify-between items-center">
                                <button onclick="switchScreen('pretest')" class="text-slate-600 hover:text-slate-900 text-sm font-medium">← Pre-Test</button>
                                <button onclick="switchScreen('game')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl font-medium text-sm shadow">
                                    Lanjut ke Game Simulasi ➔
                                </button>
                            </div>
                        </div>
                    `;
                    break;

                case 'game':
                    container.innerHTML = `
                        <div class="text-center">
                            <span class="text-4xl mb-2 inline-block">🎮</span>
                            <h2 class="text-xl font-bold text-slate-900 mb-1">Mini-Game Simulasi: UTBK Speed Run</h2>
                            <p class="text-slate-600 text-sm mb-6">Uji kecepatan analisis soal dalam waktu singkat!</p>
                            
                            <div id="game-arena" class="bg-slate-50 p-6 rounded-2xl border border-slate-200 max-w-lg mx-auto text-left">
                                <div class="flex justify-between items-center mb-4 text-xs font-semibold text-slate-500">
                                    <span>TANTANGAN KASUS #1</span>
                                    <span class="bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full">Skor: <span id="current-game-score">${gameScore}</span></span>
                                </div>
                                <p class="text-sm font-medium text-slate-900 mb-4">
                                    "Although renewable energy is growing rapidly, fossil fuels still dominate global power consumption due to existing infrastructure."<br><br>
                                    <strong>Pertanyaan:</strong> What does the conjunction 'Although' imply in this sentence?
                                </p>
                                <div class="space-y-2">
                                    <button onclick="handleGameAnswer(true)" class="w-full text-left p-3 rounded-xl bg-white border border-slate-200 hover:border-indigo-500 hover:bg-indigo-50 text-sm transition">
                                        A. Showing a contrast or unexpected condition
                                    </button>
                                    <button onclick="handleGameAnswer(false)" class="w-full text-left p-3 rounded-xl bg-white border border-slate-200 hover:border-indigo-500 hover:bg-indigo-50 text-sm transition">
                                        B. Indicating a direct cause and effect
                                    </button>
                                    <button onclick="handleGameAnswer(false)" class="w-full text-left p-3 rounded-xl bg-white border border-slate-200 hover:border-indigo-500 hover:bg-indigo-50 text-sm transition">
                                        C. Stating a chronological sequence of events
                                    </button>
                                </div>
                            </div>

                            <div class="mt-6 flex justify-between items-center max-w-lg mx-auto">
                                <button onclick="switchScreen('materials')" class="text-slate-600 hover:text-slate-900 text-sm font-medium">← Materi</button>
                                <button onclick="switchScreen('posttest')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl font-medium text-sm shadow">
                                    Lanjut ke Post-Test ➔
                                </button>
                            </div>
                        </div>
                    `;
                    break;

                case 'posttest':
                    container.innerHTML = `
                        <div>
                            <div class="border-b pb-3 mb-4 flex justify-between items-center">
                                <h2 class="text-xl font-bold text-slate-900">📊 Post-Test Uji Kompetensi Akhir</h2>
                                <span class="text-xs bg-indigo-100 text-indigo-800 px-2.5 py-1 rounded-full font-medium">5 Soal UTBK</span>
                            </div>
                            <p class="text-slate-600 text-sm mb-6">Kerjakan evaluasi berikut untuk mengukur tingkat pemahaman akhir materi.</p>
                            
                            <div class="space-y-6">
                                ${posttestData.map((item, idx) => `
                                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                        <p class="font-medium text-sm text-slate-900 mb-3">${idx + 1}. ${item.question}</p>
                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                            ${item.options.map((opt, oIdx) => `
                                                <label class="flex items-center space-x-3 p-2.5 bg-white rounded-lg border border-slate-200 cursor-pointer hover:border-indigo-400 text-sm transition">
                                                    <input type="radio" name="post_${item.id}" value="${oIdx}" ${posttestAnswers[item.id] == oIdx ? 'checked' : ''} onchange="posttestAnswers[${item.id}] = ${oIdx}" class="text-indigo-600">
                                                    <span>${opt}</span>
                                                </label>
                                            `).join('')}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>

                            <div class="mt-6 flex justify-between items-center">
                                <button onclick="switchScreen('game')" class="text-slate-600 hover:text-slate-900 text-sm font-medium">← Game</button>
                                <button onclick="submitPosttest()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl font-medium text-sm shadow">
                                    Kirim Jawaban & Lihat Pembahasan ➔
                                </button>
                            </div>
                        </div>
                    `;
                    break;

                case 'review':
                    container.innerHTML = `
                        <div>
                            <div class="bg-indigo-50 border border-indigo-200 p-4 rounded-2xl mb-6 text-center">
                                <h3 class="text-lg font-bold text-indigo-900 mb-1">Hasil Post-Test Kamu</h3>
                                <p class="text-3xl font-extrabold text-indigo-600 mb-1">${score} / 100</p>
                                <p class="text-xs text-indigo-700">${score >= 80 ? 'Luar biasa! Persiapan UTBK kamu sangat matang.' : 'Bagus! Pelajari pembahasan di bawah ini untuk meningkatkan skormu.'}</p>
                            </div>

                            <h4 class="font-bold text-slate-900 mb-4 text-base">🔍 Pembahasan Per Soal</h4>
                            <div class="space-y-4 mb-6">
                                ${posttestData.map((item, idx) => {
                                    const userAns = posttestAnswers[item.id];
                                    const isCorrect = userAns == item.answer;
                                    return `
                                        <div class="p-4 rounded-xl border ${isCorrect ? 'bg-emerald-50/50 border-emerald-200' : 'bg-rose-50/50 border-rose-200'}">
                                            <div class="flex justify-between items-start mb-2">
                                                <span class="text-xs font-bold px-2 py-0.5 rounded ${isCorrect ? 'bg-emerald-200 text-emerald-800' : 'bg-rose-200 text-rose-800'}">
                                                    ${isCorrect ? 'Benar ✓' : 'Kurang Tepat ✗'}
                                                </span>
                                                <span class="text-xs text-slate-500">Soal #${idx + 1}</span>
                                            </div>
                                            <p class="font-medium text-sm text-slate-900 mb-2">${item.question}</p>
                                            <p class="text-xs text-slate-600 mb-1"><strong>Kunci Jawaban:</strong> ${item.options[item.answer]}</p>
                                            <p class="text-xs text-indigo-900 bg-white p-3 rounded-lg border border-indigo-100 mt-2">
                                                💡 <strong>Pembahasan:</strong> ${item.explanation}
                                            </p>
                                        </div>
                                    `;
                                }).join('')}
                            </div>

                            <div class="flex justify-between items-center">
                                <button onclick="switchScreen('posttest')" class="text-slate-600 hover:text-slate-900 text-sm font-medium">← Ulangi Kuis</button>
                                <button onclick="switchScreen('reflection')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl font-medium text-sm shadow">
                                    Lanjut ke Refleksi ➔
                                </button>
                            </div>
                        </div>
                    `;
                    break;

                case 'reflection':
                    container.innerHTML = `
                        <div class="max-w-lg mx-auto">
                            <h2 class="text-xl font-bold text-slate-900 mb-2 text-center">💬 Refleksi Pembelajaran</h2>
                            <p class="text-slate-600 text-sm mb-6 text-center">Bantu kami mengetahui sejauh mana pemahamanmu setelah mengikuti sesi interaktif ini.</p>
                            
                            <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200 space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-2">Seberapa percaya diri kamu menghadapi soal UTBK Bahasa Inggris sekarang?</label>
                                    <div class="flex justify-center gap-3">
                                        ${[1, 2, 3, 4, 5].map(star => `
                                            <button onclick="setRating(${star})" class="w-10 h-10 rounded-xl font-bold text-lg transition ${reflectionData.rating >= star ? 'bg-amber-400 text-white shadow' : 'bg-white border text-slate-400'}">
                                                ★
                                            </button>
                                        `).join('')}
                                    </div>
                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Bagian mana atau materi apa yang masih ingin kamu perdalam?</label>
                                    <textarea id="reflection-note" oninput="reflectionData.note = this.value" placeholder="Tulis catatan atau kendalamu di sini..." class="w-full p-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 h-24">${reflectionData.note}</textarea>
                                </div>
                            </div>

                            <div class="mt-6 flex justify-between items-center">
                                <button onclick="switchScreen('review')" class="text-slate-600 hover:text-slate-900 text-sm font-medium">← Pembahasan</button>
                                <button onclick="finishSession()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl font-medium text-sm shadow">
                                    Selesai & Keluar 🎓
                                </button>
                            </div>
                        </div>
                    `;
                    break;

                case 'finish':
                    container.innerHTML = `
                        <div class="text-center py-8">
                            <span class="text-6xl mb-4 inline-block">🎉</span>
                            <h2 class="text-2xl font-bold text-slate-900 mb-2">Sesi Pembelajaran Selesai!</h2>
                            <p class="text-slate-600 max-w-md mx-auto mb-6 text-sm">
                                Terima kasih telah menyelesaikan materi dan latihan UTBK Bahasa Inggris Kelas XI. Teruslah berlatih secara konsisten demi impian menembus PTN favoritmu!
                            </p>
                            <div class="flex justify-center gap-3">
                                <button onclick="resetApp()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-semibold text-sm shadow transition">
                                    🔄 Ulangi dari Beranda
                                </button>
                            </div>
                        </div>
                    `;
                    break;
            }
        }

        function submitPretest() {
            if(Object.keys(pretestAnswers).length < pretestData.length) {
                alertCustom("Mohon jawab semua soal pre-test terlebih dahulu!");
                return;
            }
            switchScreen('materials');
        }

        function handleGameAnswer(isCorrect) {
            if(isCorrect) {
                gameScore += 100;
                alertCustom("Benar! 'Although' memang menunjukkan kontras / kondisi yang berlawanan.");
            } else {
                alertCustom("Kurang tepat. Coba perhatikan kembali makna konjungsi tersebut.");
            }
            document.getElementById('current-game-score').innerText = gameScore;
        }

        function submitPosttest() {
            if(Object.keys(posttestAnswers).length < posttestData.length) {
                alertCustom("Mohon jawab semua soal post-test terlebih dahulu!");
                return;
            }
            
            // Hitung skor
            let correctCount = 0;
            posttestData.forEach(item => {
                if(posttestAnswers[item.id] == item.answer) {
                    correctCount++;
                }
            });
            score = (correctCount / posttestData.length) * 100;
            switchScreen('review');
        }

        function setRating(val) {
            reflectionData.rating = val;
            renderContent();
        }

        function finishSession() {
            switchScreen('finish');
        }

        function resetApp() {
            pretestAnswers = {};
            posttestAnswers = {};
            score = 0;
            gameScore = 0;
            reflectionData = { rating: 5, note: '' };
            switchScreen('home');
        }

        // Custom modal box replacement for alert to avoid native browser popups
        function alertCustom(msg) {
            const div = document.createElement('div');
            div.className = "fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4";
            div.innerHTML = `
                <div class="bg-white rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl animate-scale">
                    <p class="text-sm font-medium text-slate-800 mb-4">${msg}</p>
                    <button onclick="this.closest('.fixed').remove()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-xl text-xs font-semibold shadow">OK</button>
                </div>
            `;
            document.body.appendChild(div);
        }

        // Initialize on load
        window.onload = function() {
            renderNav();
            renderContent();
        }
    </script>
</body>
</html>
